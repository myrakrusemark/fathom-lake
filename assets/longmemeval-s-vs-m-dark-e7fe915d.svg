<text x="382.0" y="108.2" fill="#9a6a2c" font-size="12" font-weight="600" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">94.3  A single fact the user said</text>
